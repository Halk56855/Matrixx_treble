name: Build Matrixx GSI and Release

on:
  workflow_dispatch: # لتشغيل العملية يدوياً من تبويب Actions

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # إعطاء الصلاحية لرفع المنتجات إلى قسم Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # تنظيف مساحة القرص في سيرفر GitHub لضمان عدم توقف البناء بسبب المساحة
      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force

      # تثبيت الأدوات المطلوبة لبناء أندرويد
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev liblibc6-dev-i386 libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev python3 python-is-python3 repo xz-utils

      # إعداد إعدادات الهوية لـ Git
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

      # جلب الشفرة المصدرية لروم Matrixx
      - name: Initialize Repo and Sync
        run: |
          mkdir workspace
          cd workspace
          repo init -u https://github.com/Doze-off/Matrixx_treble.git -b 16.2 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      # بدء عملية بناء ملف النظام system.img
      - name: Build GSI Image
        run: |
          cd workspace
          source build/envsetup.sh
          lunch matrixx_arm64_bgN-userdebug || lunch treble_arm64_bgN-userdebug
          make systemimage -j$(nproc --all)

      # ضغط الملف وتقليل حجمه للتنزيل والرفع
      - name: Compress System Image
        run: |
          cd workspace/out/target/product/*
          if [ -f "system.img" ]; then
            xz -z -k -8 system.img
          fi

      # إنشاء Release جديد على GitHub ورفع ملف GSI إليه
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v16.2-${{ github.run_number }}
          name: Matrixx GSI Release v16.2 Build #${{ github.run_number }}
          body: |
            ## Matrixx GSI Treble Build
            - **Branch**: 16.2
            - **Build Date**: ${{ github.event.repository.updated_at }}
            - **Status**: Successful Automated Build
          draft: false
          prerelease: false
          files: workspace/out/target/product/*/system.img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
